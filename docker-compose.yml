services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
  gateway:
    build:
      context: .
      dockerfile: whatsapp-gateway/Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      ADMIN_BIND: 0.0.0.0
    ports: ["127.0.0.1:8080:8080"]
    volumes: [wa-state:/state]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
volumes:
  wa-state:
